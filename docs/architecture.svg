<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" role="img" aria-labelledby="t d">
  <title id="t">System architecture of the PLC-supervised sorting cell</title>
  <desc id="d">The scene dashboard edits the scene through scene_server, which publishes it to the vision node and the sorting sequencer. The vision node detects the cubes; the sequencer plans with its own kinematics and sends 50 Hz joint targets to joint_drive, where the servo firmware closes 1 kHz loops on simulated joints and publishes the actual joint states to RViz. OpenPLC talks Modbus TCP to plc_bridge, which gives run and E-stop to the sequencer and E-stop and reset straight to the drive; the drive reports faults back to the PLC, which latches an alarm.</desc>
  <style>
    :root { --bg:#fcfcfb; --card:#ffffff; --ink:#0b0b0b; --muted:#52514e; --line:#8d8c87;
            --blue:#2a78d6; --orange:#eb6834; --aqua:#1baf7a; --violet:#6250d6; --gray:#b9b8b3; --yellow:#eda100; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1a1a19; --card:#232322; --ink:#f0efec; --muted:#c3c2b7; --line:#8d8c87;
              --blue:#3987e5; --orange:#d95926; --aqua:#199e70; --violet:#9085e9; --gray:#5a5954; --yellow:#c98500; }
    }
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); stroke-width: 2; }
    .h { font-size: 16px; font-weight: 700; }
    .s { font-size: 12px; fill: var(--muted); }
    .b { font-size: 12px; }
    .lbl { font-size: 11px; fill: var(--muted); }
    .arrow { stroke: var(--line); stroke-width: 1.8; fill: none; }
    .tag { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8d8c87"/>
    </marker>
  </defs>
  <rect class="bg" width="1100" height="720"/>

  <!-- left column: operator, PLC, bridge (x 30..310) -->
  <rect class="card" x="30" y="30" width="280" height="104" rx="10" style="stroke:var(--gray)"/>
  <text class="tag" x="46" y="52" style="fill:var(--muted)">OPERATOR</text>
  <text class="h" x="46" y="74">scene dashboard (browser)</text>
  <text class="s" x="46" y="93">placement, colours, random layouts,</text>
  <text class="s" x="46" y="109">IK reachability map, start, drive panel</text>
  <text class="s" x="46" y="125">panel: start · stop · reset · E-stop</text>

  <rect class="card" x="30" y="190" width="280" height="250" rx="10" style="stroke:var(--orange)"/>
  <text class="tag" x="46" y="212" style="fill:var(--orange)">PLC · SEQUENCE + SAFETY</text>
  <text class="h" x="46" y="234">OpenPLC runtime</text>
  <text class="s" x="46" y="252">ladder logic, 16 rungs</text>
  <text class="b" x="46" y="276">• self-holding start / stop</text>
  <text class="b" x="46" y="296">• NC E-stop loop + latch + reset</text>
  <text class="b" x="46" y="316">• start interlocks: at home, no fault,</text>
  <text class="b" x="58" y="333">no E-stop, no drive alarm</text>
  <text class="b" x="46" y="353">• drive alarm latched until reset</text>
  <text class="b" x="46" y="373">• IDLE, RUN, PICK, PLACE, DONE,</text>
  <text class="b" x="58" y="390">E-STOP, FAULT, DRIVE_ALARM</text>
  <text class="s" x="46" y="420">plc_check.py: 28 checks over Modbus</text>

  <rect class="card" x="30" y="500" width="280" height="104" rx="10" style="stroke:var(--orange)"/>
  <text class="tag" x="46" y="522" style="fill:var(--orange)">BRIDGE</text>
  <text class="h" x="46" y="544">plc_bridge</text>
  <text class="s" x="46" y="563">C++ · libmodbus, Modbus TCP master</text>
  <text class="s" x="46" y="580">20 Hz, coils 0..11 in, 16..26 out</text>
  <text class="s" x="46" y="596">fail-safe: no PLC = E-stop</text>

  <!-- middle column: scene, vision, sequencer (x 410..700) -->
  <rect class="card" x="410" y="30" width="290" height="104" rx="10" style="stroke:var(--violet)"/>
  <text class="tag" x="426" y="52" style="fill:var(--violet)">SCENE</text>
  <text class="h" x="426" y="74">scene_server</text>
  <text class="s" x="426" y="93">C++ · YAML scene, colour matching,</text>
  <text class="s" x="426" y="109">gray catch-all container; every edit</text>
  <text class="s" x="426" y="125">checked with the own IK before use</text>

  <rect class="card" x="410" y="190" width="290" height="90" rx="10" style="stroke:var(--aqua)"/>
  <text class="tag" x="426" y="212" style="fill:var(--aqua)">PERCEPTION</text>
  <text class="h" x="426" y="234">vision_node</text>
  <text class="s" x="426" y="253">Python · OpenCV, synthetic camera</text>
  <text class="s" x="426" y="269">→ HSV (7 colours) → cube poses</text>

  <rect class="card" x="410" y="330" width="290" height="230" rx="10" style="stroke:var(--blue)"/>
  <text class="tag" x="426" y="352" style="fill:var(--blue)">MOTION PLANNING</text>
  <text class="h" x="426" y="374">sorting_sequencer</text>
  <text class="s" x="426" y="392">C++ · Eigen, written from scratch</text>
  <text class="b" x="426" y="416">• forward kinematics (UR5e DH)</text>
  <text class="b" x="426" y="436">• Jacobian, manipulability</text>
  <text class="b" x="426" y="456">• damped least-squares IK</text>
  <text class="b" x="426" y="476">• Cartesian line + slerp planner</text>
  <text class="b" x="426" y="496">• trapezoidal velocity profile</text>
  <text class="b" x="426" y="516">• pick-and-place, path stop, resume</text>
  <text class="s" x="426" y="544">sends targets, not joint angles</text>

  <!-- right column: drive, visualization (x 790..1070) -->
  <rect class="card" x="790" y="330" width="280" height="250" rx="10" style="stroke:var(--yellow)"/>
  <text class="tag" x="806" y="352" style="fill:var(--yellow)">SERVO DRIVE · 1 kHz</text>
  <text class="h" x="806" y="374">joint_drive → servo_core</text>
  <text class="s" x="806" y="392">ROS-free firmware: float, no heap</text>
  <text class="b" x="806" y="416">• setpoint interpolation</text>
  <text class="b" x="806" y="436">• cascaded P / PI + feedforward,</text>
  <text class="b" x="818" y="453">anti-windup, filtered velocity</text>
  <text class="b" x="806" y="473">• following-error trip → STO</text>
  <text class="b" x="806" y="493">• E-stop: supervised stop → STO</text>
  <text class="s" x="806" y="520">simulated UR5e joints: gravity,</text>
  <text class="s" x="806" y="536">inertia, friction, gears, encoders</text>
  <text class="s" x="806" y="562">18 gtests · no-heap / no-throw check</text>

  <rect class="card" x="790" y="630" width="280" height="70" rx="10" style="stroke:var(--gray)"/>
  <text class="tag" x="806" y="652" style="fill:var(--muted)">VISUALIZATION</text>
  <text class="h" x="806" y="674">robot_state_publisher → RViz</text>
  <text class="s" x="806" y="691">actual arm, table, bins, cubes</text>

  <!-- arrows -->
  <path class="arrow" d="M310 82 H410" marker-end="url(#a)"/>
  <text class="lbl" x="318" y="74">scene/command</text>
  <path class="arrow" d="M555 134 V190" marker-end="url(#a)"/>
  <text class="lbl" x="561" y="166">scene/config</text>
  <path class="arrow" d="M700 82 H745 V410 H700" marker-end="url(#a)"/>
  <text class="lbl" x="751" y="200">scene/</text>
  <text class="lbl" x="751" y="214">config</text>
  <path class="arrow" d="M555 280 V330" marker-end="url(#a)"/>
  <text class="lbl" x="561" y="310">vision/detections</text>
  <path class="arrow" d="M170 134 V160 H380 V470 H410" marker-end="url(#a)"/>
  <text class="lbl" x="178" y="154">cell/start</text>
  <path class="arrow" d="M170 440 V500" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="lbl" x="178" y="474">Modbus coils</text>
  <path class="arrow" d="M310 530 H410" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="lbl" x="318" y="522">run · estop</text>
  <text class="lbl" x="318" y="546">arm status</text>
  <path class="arrow" d="M700 450 H790" marker-end="url(#a)"/>
  <text class="lbl" x="706" y="442">targets 50 Hz</text>
  <text class="lbl" x="706" y="466">+ payload</text>
  <path class="arrow" d="M790 515 H700" marker-end="url(#a)"/>
  <text class="lbl" x="706" y="507">drive/ready</text>
  <path class="arrow" d="M930 580 V630" marker-end="url(#a)"/>
  <text class="lbl" x="936" y="610">joint_states (actual)</text>
  <path class="arrow" d="M310 572 H360 V622 H772 V548 H790" marker-end="url(#a)"/>
  <text class="lbl" x="400" y="616">plc/estop · reset → drive (direct, like a hardwired STO input)</text>
  <path class="arrow" d="M790 566 H781 V652 H340 V588 H310" marker-end="url(#a)"/>
  <text class="lbl" x="400" y="646">drive/fault → PLC latches drive_alarm</text>
</svg>
